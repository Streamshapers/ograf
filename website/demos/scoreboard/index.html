<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <title>OGraf Demo — Live Scoreboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0e1a;
      background-image: url('../../assets/img/bg-stadium.jpg');
      background-size: cover;
      background-position: center center;
      position: relative;
    }

    /* Dark overlay */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(4, 7, 18, 0.6);
      pointer-events: none;
    }

    ograf-scoreboard {
      display: block;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <ograf-scoreboard id="graphic"></ograf-scoreboard>

  <script type="module">
    import OGrafScoreboard from './graphic.mjs';

    customElements.define('ograf-scoreboard', OGrafScoreboard);

    const el = document.getElementById('graphic');
    const messageOrigin = window.location.origin;

    const notifyParent = message => parent.postMessage(message, messageOrigin);

    window.addEventListener('message', async ({ data, origin, source }) => {
      if (source !== parent || origin !== messageOrigin) return;
      const { action, data: payload } = data ?? {};
      if (!action) return;

      switch (action) {
        case 'ping':
          notifyParent({ event: 'ready' });
          break;

        case 'play':
          if (payload && Object.keys(payload).length) {
            await el.updateAction(payload, true);
          }
          await el.playAction(null, null, false);
          notifyParent({ event: 'playing' });
          break;

        case 'stop':
          await el.stopAction(false);
          notifyParent({ event: 'stopped' });
          break;

        case 'update':
          await el.updateAction(payload ?? {});
          break;

        case 'custom':
          await el.customAction(payload?.id, payload, false);
          notifyParent({ event: 'state', state: el.getState() });
          break;
      }
    });

    await el.load({});
    notifyParent({ event: 'ready' });
  </script>

</body>
</html>
