<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <title>OGraf Demo — News Lower Third</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0e1a;
      position: relative;
    }

    /* Background video — autoplay, muted, looped, plays inline. */
    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: calc(var(--focus-x, 0.5) * 100%) center;
      z-index: 0;
      pointer-events: none;
    }

    /* Dark overlay to keep text readable, above video, below graphic. */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .graphic-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
      z-index: 2;
    }

    ograf-lower-third {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline preload="auto">
    <!-- WebM (VP9) — preferred by modern Chrome/Firefox/Edge. -->
    <source src="../../assets/video/Background-Interview-Video-720.webm" type="video/webm">
    <!-- MP4 (H.264) — fallback for Safari & older WebViews. -->
    <source src="../../assets/video/Background-Interview-Video-720.mp4" type="video/mp4">
  </video>

  <div class="graphic-canvas" id="graphic-canvas">
    <ograf-lower-third id="graphic"></ograf-lower-third>
  </div>

  <script type="module">
    /* graphic.mjs self-registers <ograf-lower-third> on import — we
       just need the side-effect, no need to grab the class. */
    import './graphic.mjs';

    const el = document.getElementById('graphic');
    const canvas = document.getElementById('graphic-canvas');
    const messageOrigin = window.location.origin;
    const canvasSize = { width: 1920, height: 1080 };
    let focusX = 0.5;

    const notifyParent = message => parent.postMessage(message, messageOrigin);

    function fitCanvas() {
      const viewportWidth = document.documentElement.clientWidth;
      const viewportHeight = document.documentElement.clientHeight;
      const scale = Math.max(
        viewportWidth / canvasSize.width,
        viewportHeight / canvasSize.height
      );
      if (!(scale > 0) || !Number.isFinite(scale)) return;

      const left = Math.round(viewportWidth / 2 - focusX * canvasSize.width * scale);
      const top = Math.round(viewportHeight / 2 - canvasSize.height * scale / 2);
      canvas.style.left = `${left}px`;
      canvas.style.top = `${top}px`;
      canvas.style.transform = `scale(${scale})`;

      const visibleWidth = viewportWidth / scale;
      const visibleLeft = Math.max(
        0,
        Math.min(canvasSize.width - visibleWidth, -left / scale)
      );
      el.style.setProperty('--visible-left', `${visibleLeft}px`);
      el.style.setProperty('--visible-width', `${visibleWidth}px`);
    }

    function applyFormat({ layout, focusX: nextFocusX } = {}) {
      if (layout) {
        el.setAttribute('layout', layout);
      } else {
        el.removeAttribute('layout');
      }
      focusX = Number.isFinite(Number(nextFocusX)) ? Number(nextFocusX) : 0.5;
      document.documentElement.style.setProperty('--focus-x', focusX);
      fitCanvas();
    }

    // Read viewing-context hints from the URL so the LT can adapt its
    // layout when this demo is embedded inside a non-16:9 viewport
    // (e.g. the phone slot in the multi-device stage section).
    const params = new URLSearchParams(location.search);
    applyFormat({
      layout: params.get('layout'),
      focusX: parseFloat(params.get('focusX'))
    });
    window.addEventListener('resize', fitCanvas);

    // Listen for control messages from the parent page
    window.addEventListener('message', async ({ data, origin, source }) => {
      if (source !== parent || origin !== messageOrigin) return;
      const { action, data: payload } = data ?? {};
      if (!action) return;

      switch (action) {
        case 'ping':
          notifyParent({ event: 'ready' });
          break;

        case 'play':
          // Apply any data update silently before playing
          if (payload && Object.keys(payload).length) {
            await el.updateAction(payload, true); // skipAnimation=true
          }
          await el.playAction(null, null, false);
          notifyParent({ event: 'playing' });
          break;

        case 'stop':
          await el.stopAction(false);
          notifyParent({ event: 'stopped' });
          break;

        case 'update':
          await el.updateAction(payload ?? {});
          break;

        case 'format':
          applyFormat(payload);
          break;
      }
    });

    // Auto-load with defaults on startup
    await el.load({});
    notifyParent({ event: 'ready' });
  </script>

</body>
</html>
